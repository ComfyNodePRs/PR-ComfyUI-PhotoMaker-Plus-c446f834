[project]
name = "photomaker-plus"
description = "ComfyUI reference implementation for [a/PhotoMaker](https://github.com/TencentARC/PhotoMaker) models.\nNOTE: PhotoMaker V2 is supported."
version = "1.0.0"
license = "MIT" 
# classifiers = [
#     # For OS-independent nodes (works on all operating systems)
#     "Operating System :: OS Independent",
#
#     # OR for OS-specific nodes, specify the supported systems:
#     "Operating System :: Microsoft :: Windows",  # Windows specific
#     "Operating System :: POSIX :: Linux",  # Linux specific
#     "Operating System :: MacOS",  # macOS specific
#
#     # GPU Accelerator support. Pick the ones that are supported by your extension.
#     "Environment :: GPU :: NVIDIA CUDA",    # NVIDIA CUDA support
#     "Environment :: GPU :: AMD ROCm",       # AMD ROCm support
#     "Environment :: GPU :: Intel Arc",      # Intel Arc support
#     "Environment :: NPU :: Huawei Ascend",  # Huawei Ascend support
#     "Environment :: GPU :: Apple Metal",    # Apple Metal support
# ]

dependencies = ["onnxruntime", "onnxruntime-gpu; sys_platform != 'darwin' and platform_machine == 'x86_64'", "insightface", "numpy<2"]

[project.urls]
Repository = "https://github.com/shiimizu/ComfyUI-PhotoMaker-Plus"
#  Used by Comfy Registry https://registry.comfy.org
Documentation = "https://github.com/shiimizu/ComfyUI-PhotoMaker-Plus/wiki"
"Bug Tracker" = "https://github.com/shiimizu/ComfyUI-PhotoMaker-Plus/issues"

[tool.comfy]
PublisherId = ""
DisplayName = "ComfyUI-PhotoMaker-Plus"
Icon = ""
includes = [] 
